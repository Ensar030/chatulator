# Minecraft 1.20.1
minecraft_version=1.20.1
java_version=17
pack_format=15
loaders=fabric,forge,neoforge

# Fabric (Remap-Loom, da 1.20.1 noch obfuskiert ist)
fabric_minecraft_range=~1.20.1
fabric_loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1

# Forge (ModDevGradle Legacy, inkl. Reobfuskierung nach SRG)
forge_version=1.20.1-47.4.28
forge_loader_range=[47,)
forge_version_range=[47,)
forge_minecraft_range=[1.20.1,1.20.2)
forge_platform=forge-eventbus6

# NeoForge fuer 1.20.1 ist ein Forge-47-Fork und laedt Forge-Mods direkt.
# Es wird deshalb das Forge-Jar (mit kompatiblem mods.toml) verwendet.
neoforge_mode=reuse-forge
chat_api=chat-1.20

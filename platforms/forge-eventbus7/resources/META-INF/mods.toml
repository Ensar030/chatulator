modLoader="javafml"
loaderVersion="${forge_loader_range}"
license="${mod_license}"
# Reiner Client-Mod: wird auf dedizierten Servern nicht geladen und blockiert keine Server-Verbindung.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_minecraft_range}"
    ordering="NONE"
    side="CLIENT"
